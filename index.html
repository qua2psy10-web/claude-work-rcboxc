<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RCボックスカルバート 設計計算</title>
<style>
:root {
  --bg: #f4f6f9;
  --panel: #ffffff;
  --line: #d8dfe8;
  --ink: #1c2733;
  --muted: #63748a;
  --accent: #1d4ed8;
  --ok: #15803d;
  --ok-bg: #e8f5ec;
  --ng: #b91c1c;
  --ng-bg: #fdeaea;
  --warn-bg: #fff7e6;
  --warn-line: #e0b45a;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, system-ui, sans-serif;
  background: var(--bg);
  color: var(--ink);
  font-size: 14px;
  line-height: 1.6;
}

header.app {
  background: #25405c;
  color: #fff;
  padding: 12px 18px;
  display: flex;
  align-items: baseline;
  gap: 14px;
  flex-wrap: wrap;
}
header.app h1 { font-size: 17px; margin: 0; font-weight: 600; }
header.app .sub { font-size: 12px; opacity: .85; }
header.app .actions { margin-left: auto; display: flex; gap: 8px; }

button {
  font: inherit;
  padding: 5px 12px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: var(--panel);
  color: var(--ink);
  cursor: pointer;
}
button:hover { border-color: var(--accent); color: var(--accent); }

main {
  display: grid;
  grid-template-columns: 300px minmax(360px, 560px) minmax(380px, 1fr);
  gap: 14px;
  padding: 14px;
  align-items: start;
}
@media (max-width: 1100px) { main { grid-template-columns: 1fr; } }

.panel {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 12px 14px;
}
.panel.scroll { max-height: calc(100vh - 90px); overflow: auto; }

details { border-bottom: 1px solid var(--line); }
details:last-child { border-bottom: 0; }
summary {
  cursor: pointer;
  font-weight: 600;
  padding: 8px 2px;
  color: #25405c;
}
.fields { padding: 2px 2px 10px; }

.field { display: block; margin-bottom: 8px; font-size: 13px; }
.field > span { display: block; color: var(--muted); }
.field em { font-style: normal; opacity: .8; }
.field input[type=number], .field select {
  width: 100%;
  font: inherit;
  padding: 4px 7px;
  border: 1px solid var(--line);
  border-radius: 5px;
  background: #fff;
}
.field.check { display: flex; align-items: center; gap: 7px; }
.field.check > span { color: var(--ink); }
.help { display: block; font-size: 11px; color: var(--muted); margin-top: 2px; }

.msg { border-radius: 7px; padding: 9px 12px; margin-bottom: 10px; }
.msg ul { margin: 5px 0 0; padding-left: 18px; }
.msg.verdict { display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; }
.msg.verdict.ok { background: var(--ok-bg); border: 1px solid #a9d7b8; color: var(--ok); }
.msg.verdict.ng { background: var(--ng-bg); border: 1px solid #e8b0b0; color: var(--ng); }
.msg.warn { background: var(--warn-bg); border: 1px solid var(--warn-line); }
.msg.error { background: var(--ng-bg); border: 1px solid #e8b0b0; color: var(--ng); }

.tabs { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 8px; }
.tab { padding: 4px 11px; font-size: 13px; }
.tab.active { background: #25405c; color: #fff; border-color: #25405c; }
.figwrap { text-align: center; }

svg.fig { width: 100%; height: auto; background: #fff; }
svg.fig text { font-size: 11px; fill: #33465c; font-family: inherit; }
svg.fig text.note { font-size: 10.5px; fill: #5a6b80; }
svg.fig text.title { font-size: 12px; font-weight: 600; fill: #25405c; }
svg.fig text.val { font-size: 10.5px; fill: #b91c1c; font-weight: 600; }
svg.fig .dim line { stroke: #7c8ea3; stroke-width: 1; }
svg.fig .dim line.ext { stroke-dasharray: 3 2; }
svg.fig .dim circle { fill: #7c8ea3; }
svg.fig .rebar { stroke: #b91c1c; stroke-width: 1.6; stroke-dasharray: 7 4; }
svg.fig .arrow { stroke: #c2410c; stroke-width: 1.2; }
svg.fig .arrow.lat { stroke: #0e7490; }
svg.fig .arrow.react { stroke: #15803d; }
svg.fig .lvl { stroke: #9a3412; stroke-width: 1; }
svg.fig .axis { fill: none; stroke: #8ea0b4; stroke-width: 1; stroke-dasharray: 5 3; }
svg.fig .diag { fill: rgba(29, 78, 216, .18); stroke: #1d4ed8; stroke-width: 1.3; }
svg.fig .diag.S { fill: rgba(13, 148, 136, .18); stroke: #0d9488; }
svg.fig .diag.N { fill: rgba(147, 51, 234, .15); stroke: #9333ea; }
svg.fig .diag.react { fill: rgba(21, 128, 61, .18); stroke: #15803d; }

h3 { font-size: 14px; margin: 16px 0 6px; color: #25405c; }
h3:first-child { margin-top: 2px; }
.tablewrap { overflow-x: auto; }
/* 列を潰さず、収まらない場合は横スクロールさせる */
.tablewrap table { width: auto; min-width: 100%; }
.tablewrap th, .tablewrap td { white-space: nowrap; }
table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
th, td { border: 1px solid var(--line); padding: 4px 7px; text-align: right; }
th { background: #eef2f7; font-weight: 600; text-align: center; }
td:first-child, tbody th { text-align: left; }
td small { color: var(--muted); }
td.bad { background: var(--ng-bg); color: var(--ng); font-weight: 600; }
.badge { display: inline-block; padding: 1px 8px; border-radius: 10px; font-weight: 700; font-size: 11px; }
.badge.ok { background: var(--ok-bg); color: var(--ok); }
.badge.ng { background: var(--ng-bg); color: var(--ng); }
p.note { font-size: 12px; color: var(--muted); }

/* ---- 計算書(印刷) ---- */
#report { display: none; }
.report { font-size: 12px; line-height: 1.7; }
.report h1 { font-size: 26px; margin: 0 0 10px; letter-spacing: .18em; }
.report h2 {
  font-size: 15px; border-bottom: 1.5px solid #25405c;
  padding-bottom: 3px; margin: 0 0 10px;
}
.report h3 { font-size: 13px; margin: 14px 0 5px; color: #25405c; }
.report .chapter { margin-bottom: 26px; }
.report .formula {
  background: #f4f6f9; border-left: 3px solid #8ea0b4;
  padding: 5px 10px; margin: 5px 0;
}
.report .figrow { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.report .figrow svg { width: 48%; min-width: 240px; }
.report .figrow:only-child svg, .report .cover .figrow svg { width: 60%; }
.report .rp-foot {
  margin-top: 22px; font-size: 11px; color: var(--muted);
  border-top: 1px solid var(--line); padding-top: 6px;
}
.report .ok { color: var(--ok); }
.report .ng { color: var(--ng); }

/* 表紙 */
.report .cover { text-align: center; padding: 24px 0 0; margin-bottom: 26px; }
.report .cover-code { text-align: right; font-size: 12px; color: var(--muted); }
.report .cover-sub { color: var(--muted); margin: 0 0 22px; }
.report .cover-box { display: inline-block; text-align: left; margin: 0 auto 18px; }
.report .cover-verdict { font-size: 16px; font-weight: 700; letter-spacing: .1em; }
.report .cover-verdict.ok { color: var(--ok); }
.report .cover-verdict.ng { color: var(--ng); }

/* 表 */
table.rp { border-collapse: collapse; width: 100%; margin: 6px 0 10px; font-size: 11.5px; }
table.rp th, table.rp td { border: 1px solid var(--line); padding: 3px 6px; }
table.rp th { background: #eef2f7; text-align: center; font-weight: 600; }
table.rp.num td { text-align: right; }
table.rp.num td:nth-child(1), table.rp.num td:nth-child(2) { text-align: left; }
table.rp.meta { width: auto; margin: 0 auto 14px; }
table.rp.meta td:first-child { background: #eef2f7; font-weight: 600; }

/* 「記号 ＝ 値 [単位]」の整列 */
table.rp.def { width: auto; border: 0; }
table.rp.def td { border: 0; padding: 1px 5px; }
table.rp.def .lbl { text-align: left; min-width: 12em; }
table.rp.def .sym { text-align: left; white-space: nowrap; }
table.rp.def .eq { text-align: center; }
table.rp.def .val { text-align: right; font-variant-numeric: tabular-nums; min-width: 5em; }
table.rp.def .unit { text-align: left; color: var(--muted); }

/* 各ページに繰り返すヘッダ */
.print-header { display: none; }

@media print {
  body { background: #fff; }
  header.app, main { display: none !important; }
  #report { display: block; padding: 0; }
  .print-header {
    display: block; position: fixed; top: 0; left: 0; right: 0;
    font-size: 10px; color: #33465c; border-bottom: .5px solid #b9c5d2;
    padding-bottom: 2px; display: flex; justify-content: space-between;
  }
  .report { padding-top: 14px; }
  /* 章の頭でページを送る。表紙の直後も同様。 */
  .report .chapter { break-before: page; }
  .report .cover { break-after: page; margin-bottom: 0; }
  .report h2, .report h3 { break-after: avoid; }
  table.rp, .figrow { break-inside: avoid; }
  tr { break-inside: avoid; }
  @page { size: A4 portrait; margin: 16mm 14mm; }
}

</style>
</head>
<body>
<header class="app">
  <h1>RCボックスカルバート 設計計算</h1>
  <span class="sub">単室(1連) / 道路土工 カルバート工指針 / 許容応力度法</span>
  <div class="actions">
    <button id="btn-save" type="button">条件を保存</button>
    <button id="btn-load" type="button">条件を読込</button>
    <button id="btn-reset" type="button">既定値に戻す</button>
    <button id="btn-print" type="button">計算書を印刷</button>
    <input id="file" type="file" accept="application/json" hidden>
  </div>
</header>

<main>
  <section class="panel scroll" aria-label="設計条件の入力">
    <div id="form"></div>
  </section>
  <section class="panel" aria-label="図">
    <div id="figure"></div>
  </section>
  <section class="panel scroll" aria-label="計算結果">
    <div id="messages"></div>
    <div id="results"></div>
  </section>
</main>

<div id="report"></div>

<script>
(function () {
'use strict';
var __defs = {}, __cache = {};
function __define(id, factory) { __defs[id] = factory; }
function __require(id) {
  if (!(id in __cache)) {
    if (!(id in __defs)) throw new Error('モジュールが見つかりません: ' + id);
    __cache[id] = __defs[id]();
  }
  return __cache[id];
}
__define("ui/app", function () {
/**
 * 画面の組み立てと再計算
 */

const {design, defaultInput, normalizeInput} = __require("core/design");
const {sectionSVG, loadSVG, diagramSVG, reactionSVG} = __require("ui/draw");
const {buildReport} = __require("ui/report");

const STORAGE_KEY = 'rc-box-culvert-input-v1';

const num = (v, digits = 2) =>
  (v === null || v === undefined || !Number.isFinite(v) ? '—' : v.toFixed(digits));

/** 入力欄の定義。path は入力オブジェクトのキー経路。 */
const FIELDS = [
  {
    group: '工事情報', items: [
      { path: 'project.name', label: '工事名', type: 'text' },
      { path: 'project.section', label: '工区名', type: 'text' },
      { path: 'project.designer', label: '設計者', type: 'text' },
      { path: 'project.date', label: '作成日', type: 'text', help: '空欄なら計算書生成時の日付' },
      { path: 'project.code', label: '製品No. / 型式', type: 'text' },
    ],
  },
  {
    group: '形状(mm)', open: true, items: [
      { path: 'dims.clearWidth', label: '内空幅 B', step: 50 },
      { path: 'dims.clearHeight', label: '内空高 H', step: 50 },
      { path: 'dims.topThickness', label: '頂版厚 t1', step: 10 },
      { path: 'dims.bottomThickness', label: '底版厚 t2', step: 10 },
      { path: 'dims.wallThickness', label: '側壁厚 t3', step: 10 },
      { path: 'dims.haunchTopH', label: '頂版ハンチ 水平', step: 10 },
      { path: 'dims.haunchTopV', label: '頂版ハンチ 鉛直', step: 10 },
      { path: 'dims.haunchBottomH', label: '底版ハンチ 水平', step: 10 },
      { path: 'dims.haunchBottomV', label: '底版ハンチ 鉛直', step: 10 },
    ],
  },
  {
    group: '土質・土被り', open: true, items: [
      { path: 'soil.coverMin', label: '土被り H1(最小)', unit: 'm', step: 0.1 },
      { path: 'soil.coverMax', label: '土被り H2(最大)', unit: 'm', step: 0.1, help: 'H1 と同じ値にするとケースを畳む' },
      { path: 'soil.gamma', label: '単位体積重量 γ', unit: 'kN/m³', step: 0.5 },
      { path: 'soil.gammaSat', label: '飽和単位体積重量 γsat', unit: 'kN/m³', step: 0.5 },
      { path: 'soil.K0', label: '静止土圧係数 K0', step: 0.05 },
      { path: 'soil.alpha', label: '鉛直土圧係数 α', step: 0.05, help: '突出形で 1.0 を超える値を入力' },
      { path: 'soil.waterLevel', label: '地下水位(地表面から)', unit: 'm', step: 0.1, nullable: true, help: '空欄で地下水なし' },
      { path: 'soil.K0Left', label: '左側 K0(偏土圧)', step: 0.05, nullable: true, help: '空欄で K0 と同じ' },
      { path: 'soil.K0Right', label: '右側 K0(偏土圧)', step: 0.05, nullable: true },
    ],
  },
  {
    group: '活荷重(T-25)', items: [
      { path: 'live.enabled', label: '活荷重を考慮する', type: 'checkbox' },
      { path: 'live.wheelLoad', label: '後輪1輪の荷重 P', unit: 'kN', step: 5 },
      { path: 'live.contactA', label: '接地長 a(進行方向)', unit: 'm', step: 0.05 },
      { path: 'live.contactB', label: '接地幅 b(直角方向)', unit: 'm', step: 0.05 },
      { path: 'live.wheelSpacing', label: '左右輪の間隔', unit: 'm', step: 0.05 },
      { path: 'live.tanTheta', label: '分布角 tanθ', step: 0.1, help: '1.0 で 45°' },
      { path: 'live.impact', label: '衝撃係数 i', step: 0.05, nullable: true, help: '空欄で土被りから自動算定' },
      { path: 'live.surcharge', label: '側載時の上載荷重 Q', unit: 'kN/m²', step: 1, help: '群集荷重。側載ケースで側方土圧に加算' },
    ],
  },
  {
    group: '材料', items: [
      { path: 'material.sigmaCk', label: '設計基準強度 σck', unit: 'N/mm²', type: 'select', options: [21, 24, 27, 30, 40] },
      { path: 'material.rebarGrade', label: '鉄筋種別', type: 'select', options: ['SD295', 'SD345', 'SD390'] },
      { path: 'material.coverOuter', label: 'かぶり(外側)', unit: 'mm', step: 5 },
      { path: 'material.coverInner', label: 'かぶり(内側)', unit: 'mm', step: 5 },
      { path: 'material.gammaC', label: 'コンクリート単位体積重量', unit: 'kN/m³', step: 0.5 },
      { path: 'material.minAsRatio', label: '最小鉄筋量比(b·d に対して)', step: 0.0005 },
      { path: 'material.allowIncrease', label: '許容応力度の割増係数', step: 0.05 },
      { path: 'material.shearCe', label: 'せん断補正係数 ce(有効高)', step: 0.05, help: '道示による補正を行う場合に入力' },
      { path: 'material.shearCpt', label: 'せん断補正係数 cpt(鉄筋比)', step: 0.05 },
    ],
  },
  {
    group: '地盤・水位', items: [
      { path: 'ground.kv', label: '鉛直地盤反力係数 kv', unit: 'kN/m³', step: 1000 },
      { path: 'ground.kh', label: '水平せん断バネ kh', unit: 'kN/m³', step: 1000, nullable: true, help: '空欄で kv/3' },
      { path: 'ground.qa', label: '許容支持力度 qa', unit: 'kN/m²', step: 10 },
      { path: 'ground.friction', label: '底面摩擦係数 μ', step: 0.05 },
      { path: 'ground.upliftSafety', label: '浮上りの所要安全率', step: 0.05 },
      { path: 'ground.slideSafety', label: '水平力の所要安全率', step: 0.05 },
      { path: 'water.innerLevel', label: '内水位(内空底面から)', unit: 'm', step: 0.1 },
    ],
  },
  {
    group: '計算条件', items: [
      { path: 'options.divisions', label: '部材の分割数', step: 4, help: '大きいほど断面力の精度が上がる' },
    ],
  },
];

const getPath = (obj, path) => path.split('.').reduce((o, k) => (o ? o[k] : undefined), obj);
const setPath = (obj, path, value) => {
  const keys = path.split('.');
  const last = keys.pop();
  const t = keys.reduce((o, k) => (o[k] ??= {}), obj);
  t[last] = value;
};

let input = defaultInput();
let current = null;
let activeTab = 'section';
let activeCase = 1;

function loadStored() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    const saved = JSON.parse(raw);
    input = normalizeInput(mergeInput(defaultInput(), saved));
  } catch { /* 保存値が壊れている場合は既定値のまま */ }
}

function mergeInput(base, saved) {
  if (!saved || typeof saved !== 'object') return base;
  for (const k of Object.keys(base)) {
    if (!(k in saved)) continue;
    if (base[k] && typeof base[k] === 'object' && !Array.isArray(base[k])) {
      base[k] = mergeInput(base[k], saved[k]);
    } else {
      base[k] = saved[k];
    }
  }
  return base;
}

function store() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(input)); } catch { /* 保存できなくても継続 */ }
}

function buildForm() {
  const host = document.getElementById('form');
  host.innerHTML = FIELDS.map((g) => `
    <details ${g.open ? 'open' : ''}>
      <summary>${g.group}</summary>
      <div class="fields">
        ${g.items.map((f) => fieldHTML(f)).join('')}
      </div>
    </details>`).join('');

  host.addEventListener('input', (ev) => {
    const el = ev.target;
    if (!el.dataset.path) return;
    const f = allFields().find((x) => x.path === el.dataset.path);
    let v;
    if (f.type === 'text') v = el.value;
    else if (f.type === 'checkbox') v = el.checked;
    else if (f.type === 'select') v = Number.isNaN(Number(el.value)) ? el.value : Number(el.value);
    else if (el.value.trim() === '') v = f.nullable ? null : NaN;
    else v = Number(el.value);
    setPath(input, f.path, v);
    store();
    recalc();
  });
}

const allFields = () => FIELDS.flatMap((g) => g.items);

function fieldHTML(f) {
  const v = getPath(input, f.path);
  const id = `f_${f.path.replace(/\./g, '_')}`;
  const help = f.help ? `<span class="help">${f.help}</span>` : '';
  if (f.type === 'checkbox') {
    return `<label class="field check" for="${id}">
      <input type="checkbox" id="${id}" data-path="${f.path}" ${v ? 'checked' : ''}>
      <span>${f.label}</span>${help}</label>`;
  }
  if (f.type === 'text') {
    return `<label class="field" for="${id}"><span>${f.label}</span>
      <input type="text" id="${id}" data-path="${f.path}" value="${String(v ?? '').replace(/"/g, '&quot;')}">${help}</label>`;
  }
  if (f.type === 'select') {
    return `<label class="field" for="${id}"><span>${f.label}${f.unit ? ` <em>${f.unit}</em>` : ''}</span>
      <select id="${id}" data-path="${f.path}">
        ${f.options.map((o) => `<option value="${o}" ${o === v ? 'selected' : ''}>${o}</option>`).join('')}
      </select>${help}</label>`;
  }
  return `<label class="field" for="${id}"><span>${f.label}${f.unit ? ` <em>${f.unit}</em>` : ''}</span>
    <input type="number" id="${id}" data-path="${f.path}" step="${f.step ?? 'any'}"
      value="${v === null || v === undefined || Number.isNaN(v) ? '' : v}">${help}</label>`;
}

function syncForm() {
  for (const f of allFields()) {
    const el = document.getElementById(`f_${f.path.replace(/\./g, '_')}`);
    if (!el) continue;
    const v = getPath(input, f.path);
    if (f.type === 'checkbox') el.checked = !!v;
    else if (f.type === 'text') el.value = v ?? '';
    else el.value = v === null || v === undefined || Number.isNaN(v) ? '' : v;
  }
}

function recalc() {
  const out = design(input);
  const banner = document.getElementById('messages');
  if (!out.ok) {
    current = null;
    banner.innerHTML = `<div class="msg error"><strong>入力を確認してください</strong><ul>${
      out.errors.map((e) => `<li>${e}</li>`).join('')}</ul></div>`;
    document.getElementById('figure').innerHTML = '';
    document.getElementById('results').innerHTML = '';
    return;
  }
  current = out;
  if (!out.cases.some((c) => c.id === activeCase)) activeCase = out.governingCase;
  banner.innerHTML = renderVerdict(out) + renderWarnings(out);
  renderFigure();
  document.getElementById('results').innerHTML = renderResults(out);
  document.getElementById('report').innerHTML = buildReport(out);
}

function renderVerdict(r) {
  const cls = r.verdict.overall ? 'ok' : 'ng';

  const blob = new Blob([text], { type });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function wireActions() {
  document.getElementById('figure').addEventListener('click', (ev) => {
    const c = ev.target.closest('[data-case]');
    if (c) {
      activeCase = Number(c.dataset.case);
      renderFigure();
      document.getElementById('results').innerHTML = renderResults(current);
      return;
    }
    const t = ev.target.closest('[data-tab]');
    if (!t) return;
    activeTab = t.dataset.tab;
    renderFigure();
  });
  document.getElementById('btn-print').addEventListener('click', () => window.print());
  document.getElementById('btn-save').addEventListener('click', () => {
    download('box-culvert-input.json', JSON.stringify(input, null, 2));
  });
  document.getElementById('btn-load').addEventListener('click', () => {
    document.getElementById('file').click();
  });
  document.getElementById('file').addEventListener('change', async (ev) => {
    const f = ev.target.files[0];
    if (!f) return;
    try {
      input = normalizeInput(mergeInput(defaultInput(), JSON.parse(await f.text())));
      store(); syncForm(); recalc();
    } catch (e) {
      alert(`読み込みに失敗しました: ${e.message}`);
    }
    ev.target.value = '';
  });
  document.getElementById('btn-reset').addEventListener('click', () => {
    input = defaultInput();
    store(); syncForm(); recalc();

function start() {
  loadStored();
  buildForm();
  wireActions();
  recalc();
}

      M: [-f[2], f[5]],

  if (!t) throw new Error(`未知の鉄筋径: ${bar}`);
  return {
    bar, pitch,
    dia: t.d,
    As: (t.area * 1000) / pitch, // mm2/m
    clear: pitch - t.d,          // あき mm
    label: `${bar} @${pitch}`,
  };

  const pitches = o.pitches || DEFAULT_PITCHES;

  });

    label: '底版反力の分布',
    detail: '底版下面に浮き(負の反力)が生じないこと',
    value: qMin, allow: 0, unit: 'kN/m²',

  };
}

/** モデル座標(m, y上向き)→ SVG座標への変換器 */
function makeMapper(xmin, xmax, ymin, ymax, w, h, pad) {
  const sx = (w - 2 * pad) / Math.max(1e-9, xmax - xmin);
  const sy = (h - 2 * pad) / Math.max(1e-9, ymax - ymin);
  const k = Math.min(sx, sy);
  const ox = pad + ((w - 2 * pad) - k * (xmax - xmin)) / 2;
  const oy = pad + ((h - 2 * pad) - k * (ymax - ymin)) / 2;
  return {
    k,
    X: (x) => ox + (x - xmin) * k,
    Y: (y) => oy + (ymax - y) * k,
  };
}

/** 内空(ハンチ付き)の輪郭 */
function voidPath(geo, m) {
  const { L, Hc } = geo;
  const { t1, t2, t3, hTh, hTv, hBh, hBv } = geo.dims;
  const x0 = t3 / 2, x1 = L - t3 / 2;
  const y0 = t2 / 2, y1 = Hc - t1 / 2;
  const pts = [
    [x0 + hBh, y0], [x1 - hBh, y0], [x1, y0 + hBv],
    [x1, y1 - hTv], [x1 - hTh, y1], [x0 + hTh, y1],
    [x0, y1 - hTv], [x0, y0 + hBv],
  ];
  return 'M' + pts.map(([x, y]) => `${m.X(x).toFixed(2)},${m.Y(y).toFixed(2)}`).join('L') + 'Z';
}

function outerPath(geo, m) {
  const { L, Hc } = geo;
  const { t1, t2, t3 } = geo.dims;
  const x0 = -t3 / 2, x1 = L + t3 / 2;
  const y0 = -t2 / 2, y1 = Hc + t1 / 2;
  return `M${m.X(x0).toFixed(2)},${m.Y(y1).toFixed(2)}`
    + `L${m.X(x1).toFixed(2)},${m.Y(y1).toFixed(2)}`
    + `L${m.X(x1).toFixed(2)},${m.Y(y0).toFixed(2)}`
    + `L${m.X(x0).toFixed(2)},${m.Y(y0).toFixed(2)}Z`;
}

/** 寸法線 */
function dimLine(m, x1, y1, x2, y2, text, offset = 0, vertical = false) {
  const nx = vertical ? offset : 0;
  const ny = vertical ? 0 : offset;
  const ax = m.X(x1 + nx), ay = m.Y(y1 + ny);
  const bx = m.X(x2 + nx), by = m.Y(y2 + ny);
  const mx = (ax + bx) / 2, my = (ay + by) / 2;
  const rot = vertical ? ` transform="rotate(-90 ${mx} ${my - 5})"` : '';
  return `<g class="dim">
    <line x1="${ax}" y1="${ay}" x2="${bx}" y2="${by}"/>
    <line x1="${m.X(x1)}" y1="${m.Y(y1)}" x2="${ax}" y2="${ay}" class="ext"/>
    <line x1="${m.X(x2)}" y1="${m.Y(y2)}" x2="${bx}" y2="${by}" class="ext"/>
    <circle cx="${ax}" cy="${ay}" r="2"/><circle cx="${bx}" cy="${by}" r="2"/>
    <text x="${mx}" y="${my - 5}" text-anchor="middle"${rot}>${esc(text)}</text>
  </g>`;
}

/** 断面図(配筋を含む) */
function sectionSVG(result, w = 520, h = 460) {
  const geo = result.geo;
  const { L, Hc } = geo;
  const { t1, t2, t3 } = geo.dims;

  const m = makeMapper(-t3 / 2, L + t3 / 2, -t2 / 2, Hc + t1 / 2, w, h, pad);

    ['top', 'outer', [-t3 / 2, Hc + t1 / 2], [L + t3 / 2, Hc + t1 / 2], [0, -1]],
    ['bottom', 'inner', [t3 / 2, t2 / 2], [L - t3 / 2, t2 / 2], [0, -1]],
    ['bottom', 'outer', [-t3 / 2, -t2 / 2], [L + t3 / 2, -t2 / 2], [0, 1]],
    ['left', 'inner', [t3 / 2, t2 / 2], [t3 / 2, Hc - t1 / 2], [1, 0]],
    ['left', 'outer', [-t3 / 2, -t2 / 2], [-t3 / 2, Hc + t1 / 2], [-1, 0]],
    ['right', 'inner', [L - t3 / 2, t2 / 2], [L - t3 / 2, Hc - t1 / 2], [-1, 0]],
    ['right', 'outer', [L + t3 / 2, -t2 / 2], [L + t3 / 2, Hc + t1 / 2], [1, 0]],
  ];

    const p = plan.get(`${member}:${face}`);
    if (!p || !p.selected) continue;
    const c = p.cover / 1000;
    const ax = a[0] + n[0] * c, ay = a[1] + n[1] * c;
    const bx = b[0] + n[0] * c, by = b[1] + n[1] * c;
    rebarLayer += `<line class="rebar" x1="${m.X(ax)}" y1="${m.Y(ay)}" x2="${m.X(bx)}" y2="${m.Y(by)}"/>`;

  // 配筋の凡例
  let legend = '';

    const p = plan.get(`${member}:${face}`);
    if (!p || !p.selected) return;

  <defs>
    <pattern id="hatch" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#c7d2df" stroke-width="1.6"/>
    </pattern>

  <path d="${outerPath(geo, m)} ${voidPath(geo, m)}" fill="url(#hatch)" fill-rule="evenodd"
        stroke="#25405c" stroke-width="1.8"/>
  ${rebarLayer}
  ${dimLine(m, -t3 / 2, Hc + t1 / 2, L + t3 / 2, Hc + t1 / 2, `外幅 ${mm(geo.outerW)}`, 0.45)}
  ${dimLine(m, t3 / 2, t2 / 2, L - t3 / 2, t2 / 2, `内空幅 ${mm(geo.dims.B)}`, -0.55)}
  ${dimLine(m, -t3 / 2, -t2 / 2, -t3 / 2, Hc + t1 / 2, `外高 ${mm(geo.outerH)}`, -0.45, true)}
  ${dimLine(m, t3 / 2, t2 / 2, t3 / 2, Hc - t1 / 2, `内空高 ${mm(geo.dims.H)}`, 0.30, true)}
  <text class="note" x="${m.X(L / 2)}" y="${m.Y(Hc + t1 / 2) - 26}" text-anchor="middle">頂版 t=${mm(t1)}</text>
  <text class="note" x="${m.X(L / 2)}" y="${m.Y(-t2 / 2) + 58}" text-anchor="middle">底版 t=${mm(t2)}</text>
  <text class="note" x="${m.X(L + t3 / 2) + 6}" y="${m.Y(Hc / 2)}">側壁 t=${mm(t3)}</text>
  <text class="note" x="${m.X(t3 / 2) + 4}" y="${m.Y(Hc - t1 / 2) + 22}">ハンチ ${mm(geo.dims.hTh)}×${mm(geo.dims.hTv)}</text>

}

/** 荷重図 */
function loadSVG(result, w = 520, h = 460) {
  const geo = result.geo;
  const s = result.loads.summary;
  const { L, Hc } = geo;
  const { t1, t2, t3 } = geo.dims;
  const pad = 86;
  const m = makeMapper(-t3 / 2, L + t3 / 2, -t2 / 2, Hc + t1 / 2, w, h, pad);

  const pmax = Math.max(s.qTop, s.lateralBottomLeft, s.lateralBottomRight,
    result.ana.maxReactionPressure, s.uBottom, 1);
  const A = 46 / pmax; // kN/m2 → px

  const arrow = (x1, y1, x2, y2, cls = '') =>
    `<line class="arrow ${cls}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" marker-end="url(#ah)"/>`;

  // 頂版上の鉛直荷重
  let g = '';
  const yTop = m.Y(Hc + t1 / 2);
  const nTop = 7;
  for (let i = 0; i <= nTop; i++) {
    const x = m.X(-t3 / 2 + ((L + t3) * i) / nTop);
    g += arrow(x, yTop - s.qTop * A, x, yTop - 3);
  }
  g += `<line class="lvl" x1="${m.X(-t3 / 2)}" y1="${yTop - s.qTop * A}" x2="${m.X(L + t3 / 2)}" y2="${yTop - s.qTop * A}"/>`;
  g += `<text class="note" x="${m.X(L / 2)}" y="${yTop - s.qTop * A - 8}" text-anchor="middle">鉛直荷重 ${fmt(s.qTop)} kN/m²(土圧 ${fmt(s.earthTop)} + 活荷重 ${fmt(s.live.q)})</text>`;

  // 側方土圧(台形)
  for (const [side, pTop, pBot] of [
    ['left', s.lateralTopLeft, s.lateralBottomLeft],
    ['right', s.lateralTopRight, s.lateralBottomRight]]) {
    const xw = side === 'left' ? -t3 / 2 : L + t3 / 2;
    const dir = side === 'left' ? -1 : 1;
    const n = 6;
    for (let i = 0; i <= n; i++) {
      const y = (Hc + t1 / 2) - ((Hc + (t1 + t2) / 2) * i) / n;
      const p = pTop + (pBot - pTop) * (i / n);
      const xa = m.X(xw) + dir * p * A;
      g += arrow(xa, m.Y(y), m.X(xw) + dir * 3, m.Y(y), 'lat');
    }
    g += `<line class="lvl" x1="${m.X(xw) + dir * pTop * A}" y1="${m.Y(Hc + t1 / 2)}" x2="${m.X(xw) + dir * pBot * A}" y2="${m.Y(-t2 / 2)}"/>`;
    if (side === 'left') {
      g += `<text class="note" x="${m.X(xw) - pTop * A - 4}" y="${m.Y(Hc + t1 / 2) - 6}" text-anchor="end">${fmt(pTop)}</text>`;
      g += `<text class="note" x="${m.X(xw) - pBot * A - 4}" y="${m.Y(-t2 / 2) + 14}" text-anchor="end">${fmt(pBot)} kN/m²</text>`;
    }
  }

  // 底版反力
  const yBot = m.Y(-t2 / 2);
  const rp = result.ana.reactionProfile;
  const nR = 7;
  for (let i = 0; i <= nR; i++) {
    const s0 = (geo.L * i) / nR;
    const p = rp.reduce((b, q) => (Math.abs(q.s - s0) < Math.abs(b.s - s0) ? q : b)).pressure;
    const x = m.X(s0);
    g += arrow(x, yBot + p * A, x, yBot + 3, 'react');
  }
  g += `<text class="note" x="${m.X(L / 2)}" y="${yBot + result.ana.maxReactionPressure * A + 16}" text-anchor="middle">地盤反力 最大 ${fmt(result.ana.maxReactionPressure)} kN/m²</text>`;

  if (s.uBottom > 0) {
    g += `<text class="note" x="${m.X(L / 2)}" y="${yBot + result.ana.maxReactionPressure * A + 30}" text-anchor="middle">揚圧力 ${fmt(s.uBottom)} kN/m²</text>`;
  }

  return `<svg viewBox="0 0 ${w} ${h}" class="fig" role="img" aria-label="荷重図">
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,1L9,5L0,9z" fill="#c2410c"/></marker></defs>
  <path d="${outerPath(geo, m)} ${voidPath(geo, m)}" fill="#eef2f7" fill-rule="evenodd" stroke="#25405c" stroke-width="1.6"/>
  ${g}
</svg>`;
}

const DIAGRAM_META = {
  M: { title: '曲げモーメント図 M', unit: 'kN·m/m', digits: 1 },
  S: { title: 'せん断力図 S', unit: 'kN/m', digits: 1 },
  N: { title: '軸力図 N(圧縮正)', unit: 'kN/m', digits: 1 },
};

/** 断面力図。値は部材の内空側法線方向に取る。 */
function diagramSVG(result, kind, w = 520, h = 460) {
  const geo = result.geo;
  const { L, Hc } = geo;
  const { t1, t2, t3 } = geo.dims;
  const meta = DIAGRAM_META[kind];

  // 曲げモーメントは引張側(内空側を正)に、せん断力・軸力は外側に描く
  const INWARD = { top: [0, -1], bottom: [0, 1], left: [1, 0], right: [-1, 0] };
  const dirSign = kind === 'M' ? 1 : -1;
  const NORMAL = Object.fromEntries(Object.entries(INWARD)
    .map(([k, [a, b]]) => [k, [a * dirSign, b * dirSign]]));

  let vmax = 0;
  for (const key of Object.keys(NORMAL)) {
    for (const p of result.ana.diagrams[key]) vmax = Math.max(vmax, Math.abs(p[kind]));
  }
  // 図の振幅(モデル座標)。外側に張り出す分だけ描画範囲を広げて収める。
  const amp = 0.26 * Math.min(L, Hc);
  const scale = vmax > 0 ? amp / vmax : 0;
  const m = makeMapper(
    -t3 / 2 - amp, L + t3 / 2 + amp,
    -t2 / 2 - amp, Hc + t1 / 2 + amp,
    w, h - 26, 24,
  );

  let paths = '';
  let labels = '';
  for (const key of Object.keys(NORMAL)) {
    const mem = geo.memberMap[key];
    const [nx, ny] = NORMAL[key];
    const pts = result.ana.diagrams[key];
    const base = [];
    const val = [];
    for (const p of pts) {
      const bx = mem.start.x + mem.dir.ux * p.s;
      const by = mem.start.y + mem.dir.uy * p.s;
      base.push([bx, by]);
      val.push([bx + nx * p[kind] * scale, by + ny * p[kind] * scale]);
    }
    const d = 'M' + [...base.slice(0, 1), ...val, ...base.slice(-1).reverse()]
      .map(([x, y]) => `${m.X(x).toFixed(1)},${m.Y(y).toFixed(1)}`).join('L') + 'Z';
    paths += `<path class="diag ${kind}" d="${d}"/>`;

    // 極値の注記
    let iMax = 0; let iMin = 0;
    pts.forEach((p, i) => {
      if (p[kind] > pts[iMax][kind]) iMax = i;
      if (p[kind] < pts[iMin][kind]) iMin = i;
    });
    for (const i of new Set([iMax, iMin])) {
      const p = pts[i];
      if (Math.abs(p[kind]) < vmax * 0.08) continue;
      const [vx, vy] = val[i];
      labels += `<text class="val" x="${m.X(vx) + nx * 6}" y="${m.Y(vy) - ny * 4}" text-anchor="${nx > 0 ? 'start' : nx < 0 ? 'end' : 'middle'}">${fmt(p[kind], meta.digits)}</text>`;
    }
  }

  return `<svg viewBox="0 0 ${w} ${h}" class="fig" role="img" aria-label="${esc(meta.title)}">
  <path d="${outerPath(geo, m)} ${voidPath(geo, m)}" fill="#f6f8fb" fill-rule="evenodd" stroke="#93a5b8" stroke-width="1"/>
  <path class="axis" d="M${m.X(0)},${m.Y(0)}L${m.X(L)},${m.Y(0)}L${m.X(L)},${m.Y(Hc)}L${m.X(0)},${m.Y(Hc)}Z"/>
  ${paths}${labels}
  <text class="title" x="10" y="${h - 12}">${esc(meta.title)} (${meta.unit}) 最大 ${fmt(vmax, meta.digits)}</text>
</svg>`;
}

/** 底版反力の分布図(縦横は独立にスケールする) */
function reactionSVG(result, w = 520, h = 220) {
  const geo = result.geo;
  const rp = result.ana.reactionProfile;
  const padL = 52, padR = 18, padT = 30, padB = 34;
  const pmax = Math.max(...rp.map((p) => p.pressure), 1);
  const pmin = Math.min(...rp.map((p) => p.pressure));
  const floor = Math.min(0, pmin);
  const top = pmax * 1.12;
  const X = (v) => padL + (v / geo.L) * (w - padL - padR);
  const Y = (v) => h - padB - ((v - floor) / (top - floor)) * (h - padT - padB);
  const d = 'M' + rp.map((p) => `${X(p.s).toFixed(1)},${Y(p.pressure).toFixed(1)}`).join('L');
  const ticks = [0, pmax / 2, pmax].map((v) =>
    `<line class="axis" x1="${padL}" y1="${Y(v)}" x2="${w - padR}" y2="${Y(v)}"/>`
    + `<text class="note" x="${padL - 6}" y="${Y(v) + 4}" text-anchor="end">${fmt(v)}</text>`).join('');
  return `<svg viewBox="0 0 ${w} ${h}" class="fig" role="img" aria-label="底版反力分布">
    ${ticks}
    <path class="diag react" d="${d}L${X(geo.L)},${Y(0)}L${X(0)},${Y(0)}Z"/>
    <line class="axis" x1="${padL}" y1="${Y(0)}" x2="${w - padR}" y2="${Y(0)}"/>
    <text class="title" x="10" y="16">底版の地盤反力度 (kN/m²)</text>
    <text class="note" x="${X(0)}" y="${h - 12}" text-anchor="middle">0</text>
    <text class="note" x="${X(geo.L)}" y="${h - 12}" text-anchor="middle">${fmt(geo.L, 2)} m</text>
    <text class="val" x="${X(geo.L / 2)}" y="${Y(pmax) - 6}" text-anchor="middle">最大 ${fmt(pmax)} / 最小 ${fmt(pmin)}</text>
  </svg>`;
}

return { sectionSVG, loadSVG, diagramSVG, reactionSVG };

  <h2>${no} 荷重ケース CASE-${c.id}(${esc(c.label)})</h2>

  <h3>${no}.1 設計荷重</h3>
  <p class="formula">(1) 躯体自重 Ｗ ＝ Ａc × γc
     ＝ ${n(r.geo.solidArea, 4)} × ${n(r.input.material.gammaC)} ＝ <b>${n(s.selfWeight)} kＮ/m</b></p>
  <p class="formula">(2) 鉛直土圧 Ｐvd ＝ α × σv(h)
     ＝ ${n(s.alpha, 3)} × ${n(s.sigmaVTop)} ＝ <b>${n(s.earthTop)} kＮ/m²</b></p>
  ${live}
  <p class="formula">(4) 頂版の鉛直荷重 ｑ ＝ Ｐvd${s.liveMode === 'top' && s.live.q > 0 ? ' + Ｐvl' : ''}
     ＝ <b>${n(s.qTop)} kＮ/m²</b></p>
  <p class="formula">(5) 水平土圧 σh(z) ＝ Ｋ(σv(z) − u(z)) + u(z) + Ｋ·α·Ｑ</p>
  ${table([
    ['側壁上端(頂版中心)', n(s.zTopAxis, 3), n(s.lateralTopLeft), n(s.lateralTopRight)],
    ['側壁下端(底版中心)', n(s.zBottomAxis, 3), n(s.lateralBottomLeft), n(s.lateralBottomRight)],
  ], ['位置', '深さ (m)', '左 (kN/m²)', '右 (kN/m²)'], 'num')}
  ${s.uBottom > 0 ? `<p class="formula">(6) 底版下面の揚圧力 ｕ ＝ <b>${n(s.uBottom)} kＮ/m²</b></p>` : ''}
  <p class="formula">(7) 鉛直方向の釣合い ΣＶ ＝ <b>${n(s.totalVertical)} kＮ/m</b>
     (底版反力の合計 ${n(c.ana.totalReaction)} kＮ/m、差 ${n(c.stability.balance.error, 6)})</p>
  <div class="figrow">${loadSVG({ ...r, loads: c.loads, ana: c.ana }, 400, 360)}</div>

  <h3>${no}.2 構造解析</h3>
  <p>部材軸線による閉合ラーメンとしてモデル化し、底版は鉛直地盤反力係数
     ｋv ＝ ${n(r.input.ground.kv, 0)} kＮ/m³ の弾性床上の梁として直接剛性法で解く。
     曲げモーメントは内空側引張を正とする。</p>
  <div class="figrow">${diagramSVG({ ...r, ana: c.ana }, 'M', 400, 360)}${diagramSVG({ ...r, ana: c.ana }, 'S', 400, 360)}</div>

  <h3>${no}.3 各部材の断面力</h3>
  ${forceTable(r.geo, c.ana)}
  </section>`;
}

function buildReport(r) {
  const i = r.input;
  const g = r.geo;
  const p = i.project || {};
  const today = p.date || new Date().toLocaleDateString('ja-JP');
  const title = p.name || i.title;

  // ---- 表紙 ------------------------------------------------------------
  const cover = `
  <section class="cover">
    <div class="cover-code">${p.code ? `台帳 No. ${esc(p.code)}` : ''}</div>
    <h1>ＲＣボックスカルバート<br>設 計 計 算 書</h1>
    <p class="cover-sub">単室(1連) / 道路土工 カルバート工指針 / 許容応力度法</p>
    <div class="cover-box">
      ${defRows([
        ['内空寸法', '内 幅(Ｂ)', `${mm(g.dims.B)}`, 'mm'],
        ['', '内 高(Ｈ)', `${mm(g.dims.H)}`, 'mm'],
        ['部材厚', '頂版 Ｔ1', `${mm(g.dims.t1)}`, 'mm'],
        ['', '底版 Ｔ2', `${mm(g.dims.t2)}`, 'mm'],
        ['', '側壁 Ｔ3', `${mm(g.dims.t3)}`, 'mm'],
        ['土被り', 'Ｈ1', n(i.soil.coverMin, 3), 'm'],
        ['', 'Ｈ2', n(i.soil.coverMax, 3), 'm'],
        ['活荷重', '', i.live.enabled ? `Ｔ荷重(後輪 ${n(i.live.wheelLoad, 0)} kＮ/輪)` : '考慮しない', ''],
      ])}
    </div>
    <div class="figrow">${sectionSVG(r, 420, 400)}</div>
    ${table([
      ['工事名', esc(p.name || '')],
      ['工区名', esc(p.section || '')],
      ['設計者', esc(p.designer || '')],
      ['作成日', esc(today)],
    ], null, 'meta')}
    <p class="cover-verdict ${r.verdict.overall ? 'ok' : 'ng'}">
      総合判定 ${r.verdict.overall ? 'ＯＫ' : 'ＮＧ'}</p>
  </section>`;

  // ---- 1 設計条件 ------------------------------------------------------
  const conditions = `
  <section class="chapter">
  <h2>1 設計条件</h2>

  <h3>1.1 一般条件</h3>
  ${defRows([
    ['構造形式', '', '一径間ボックスラーメン', ''],
    ['内空寸法', '(Ｂ)×(Ｈ)', `${mm(g.dims.B)} × ${mm(g.dims.H)}`, 'mm'],
    ['外形寸法', '', `${mm(g.outerW)} × ${mm(g.outerH)}`, 'mm'],
    ['設計スパン', 'Ｌ', n(g.L, 3), 'm'],
    ['設計高さ', 'Ｈo', n(g.Hc, 3), 'm'],
    ['土被り', 'Ｈ1 〜 Ｈ2', `${n(i.soil.coverMin, 3)} 〜 ${n(i.soil.coverMax, 3)}`, 'm'],
    ['コンクリート断面積', 'Ａc', n(g.solidArea, 4), 'm²/m'],
  ])}

  <h3>1.2 単位体積重量</h3>
  ${defRows([
    ['鉄筋コンクリート', 'γc', n(i.material.gammaC), 'kＮ/m³'],
    ['土(地下水位以上)', 'γs', n(i.soil.gamma), 'kＮ/m³'],
    ['土(地下水位以下)', 'γsat', n(i.soil.gammaSat), 'kＮ/m³'],
    ['水', 'γw', n(9.8), 'kＮ/m³'],
  ])}

  <h3>1.3 土圧係数</h3>
  ${defRows([
    ['(水 平)', 'Ｋa', n(i.soil.K0, 3), ''],
    ['(鉛 直)', 'α', n(i.soil.alpha, 3), ''],
  ])}

  <h3>1.4 活荷重</h3>
  ${defRows([
    ['(上 載)', '', i.live.enabled
      ? `Ｔ荷重 横断通行 (輪接地幅 a ＝ ${n(i.live.contactA, 2)}m  b ＝ ${n(i.live.contactB, 2)}m)`
      : '考慮しない', ''],
    ['(側 載)', 'Ｑ', n(i.live.surcharge), 'kＮ/m²'],
  ])}

  <h3>1.5 衝撃係数</h3>
  ${defRows([['', 'ｉ', i.live.impact === null || i.live.impact === undefined
    ? '土被りに応じて自動算定' : n(i.live.impact, 3), '']])}

  <h3>1.6 鉄筋かぶり</h3>
  ${defRows([
    ['(内 側)', '', `${i.material.coverInner}`, 'mm'],
    ['(外 側)', '', `${i.material.coverOuter}`, 'mm'],
  ])}

  <h3>1.7 許容応力度</h3>
  ${defRows([
    ['鉄筋引張応力度', 'σsa', n(r.allow.sigmaSa, 1), 'Ｎ/mm²'],
    ['鉄筋降伏点応力度', 'σsy', n(r.rebarGrade.fy, 0), 'Ｎ/mm²'],
    ['コンクリート 設計基準強度', 'σck', n(i.material.sigmaCk, 1), 'Ｎ/mm²'],
    ['       曲げ圧縮応力度', 'σca', n(r.allow.sigmaCa, 1), 'Ｎ/mm²'],
    ['       せん断応力度', 'τa', n(r.allow.tauA1, 3), 'Ｎ/mm²'],
    ['ヤング係数比', 'ｎ', '15', ''],
  ])}

  <h3>1.8 標準断面図</h3>
  <div class="figrow">${sectionSVG(r, 420, 400)}</div>

  <h3>1.9 荷重の組合せ</h3>
  <p>［荷重 CASE］</p>
  ${table(r.cases.map((c) => [
    `CASE-${c.id}`, c.modeLabel, `${n(c.cover, 3)} m`,
    c.water ? '影響あり' : '影響なし',
  ]), ['ケース', '載荷位置', '土被り', '地下水'], 'num')}
  <p class="note">上載 … 荷重がカルバート上載の場合。頂版に鉛直活荷重が載る。<br>
     側載 … 荷重がカルバート側載の場合。背面の上載荷重 Ｑ による側方土圧のみを考慮する。<br>
     本計算書は上表の ${r.cases.length} ケースについて行い、断面力の最大値で照査する。</p>
  </section>`;

  // ---- 2 断面力計算 ----------------------------------------------------
  const forces = `
  <section class="chapter">
  <h2>2 断面力計算</h2>
  <p>各荷重ケースについて設計荷重を算定し、閉合ラーメンとして構造解析を行って
     部材の断面力を求める。曲げモーメントの照査位置は支間中央およびハンチ端、
     せん断力の照査位置はハンチ端とする。</p>
  </section>
  ${r.cases.map((c, k) => caseChapter(r, c, k)).join('')}`;

  // ---- 3 断面力集計表 --------------------------------------------------
  const summary = `
  <section class="chapter">
  <h2>3 断面力集計表</h2>
  <p>各ケースより断面力の最大値を抽出する。</p>
  ${defRows([
    ['部材モーメント', 'Ｍ', '', 'kＮ·m'],
    ['軸力', 'Ｎ', '', 'kＮ'],
    ['偏位量', 'ｅ ＝ Ｍ/Ｎ', '', 'cm'],
    ['部材中心軸と鉄筋間距離', 'ｃ', '', 'cm'],
    ['軸力を考慮した曲げモーメント', 'Ｍs ＝ Ｎ(ｅ+ｃ)/100 ＝ Ｍ + Ｎ·ｃ/100', '', 'kＮ·m'],
  ])}
  ${table(r.sections.map((x) => [
    esc(x.memberName),
    esc(x.label.replace(x.memberName, '').trim()),
    x.face === 'inner' ? '内側' : '外側',
    n(x.M, 3), n(x.N, 3),
    Number.isFinite(x.check.e) ? n(x.check.e / 10, 2) : '—',
    n(x.check.c / 10, 2), n(x.check.Ms, 3),
    `CASE-${x.caseId}`,
  ]), ['部材', '点', '引張側', 'Ｍ (kN·m)', 'Ｎ (kN)', 'ｅ (cm)', 'ｃ (cm)', 'Ｍs (kN·m)', 'CASE'], 'num')}
  <p class="note">CASE の列は曲げモーメントを抽出したケースを示す。</p>
  </section>`;

  // ---- 4 必要鉄筋量 ----------------------------------------------------
  const rebar = `
  <section class="chapter">
  <h2>4 必要鉄筋量</h2>
  <p class="formula">鉄筋の曲げ引張応力度が許容値 σsa に達するときの必要鉄筋量 Ａs を求める。<br>
     中立軸 ｘ:  Ｎ·ｘ³ − 3(Ｎ·Ｔ/2 − Ｍ)·ｘ² + 6ｎＡs/ｂ·Ｍs·(ｘ − ｄ) ＝ 0<br>
     σc ＝ 2Ｍs / (ｂ·ｘ·(ｄ − ｘ/3))、  σs ＝ ｎ·σc·(ｄ − ｘ)/ｘ</p>
  ${table(r.rebarPlan.map((x) => [
    esc(x.memberName), esc(x.faceLabel),
    n(x.M, 2), n(x.N, 2), `${mm(x.h)}`, n(x.cover, 0),
    n(x.asRequired, 0), n(x.asMinimum, 0),
    x.selected ? esc(x.selected.label) : '<span class="ng">候補なし</span>',
    x.selected ? n(x.selected.As, 0) : '—',
    x.caseId ? `CASE-${x.caseId}` : '—',
  ]), ['部材', '面', '設計Ｍ', 'Ｎ', 'Ｔ (mm)', 'かぶり', '必要Ａs', '最小Ａs', '採用', '配置Ａs', 'CASE'], 'num')}
  <p class="note">配力鉄筋: 必要 ${n(r.distribution.required, 0)} mm²/m →
     ${r.distribution.selected ? esc(r.distribution.selected.label) : '—'}(主鉄筋の 1/3 以上)</p>
  </section>`;

  // ---- 5 配筋及び実応力度 ----------------------------------------------
  const stress = `
  <section class="chapter">
  <h2>5 配筋及び実応力度</h2>
  ${table(r.sections.map((x) => [
    esc(x.memberName),
    esc(x.label.replace(x.memberName, '').trim()),
    x.rebar ? esc(x.rebar.label) : '—',
    n(x.check.d, 1), n(x.check.x, 1),
    n(x.check.sigmaC, 2), n(r.allow.sigmaCa, 2),
    n(x.check.sigmaS, 1), n(r.allow.sigmaSa, 1),
    x.check.checks.concrete.ok && x.check.checks.steel.ok
      ? '<b class="ok">CHECK OK</b>' : '<b class="ng">CHECK NG</b>',
  ]), ['部材', '点', '配筋', 'ｄ (mm)', 'ｘ (mm)', 'σc', 'σca', 'σs', 'σsa', '判定'], 'num')}
  </section>`;

  // ---- 6 せん断力に対する検討 ------------------------------------------
  const shearRows = r.shear.map((x) => {
    const sec = r.sections.find((y) => y.member === x.member && y.label === x.label);
    const chk = sec ? sec.check : null;
    return [
      esc(x.memberName), esc(x.label.replace(x.memberName, '').trim()),
      ...r.cases.map((c) => n(x.perCase[c.id] ?? 0, 2)),
      `<b>${n(Math.abs(x.S), 2)}</b>`,
      `CASE-${x.caseId}`,
      chk ? n(chk.tau, 3) : '—', n(r.allow.tauA1, 3),
      chk ? (chk.checks.shear.ok ? '<b class="ok">CHECK OK</b>' : '<b class="ng">CHECK NG</b>') : '—',
    ];
  });
  const shear = `
  <section class="chapter">
  <h2>6 せん断力に対する検討</h2>
  <h3>6.1 せん断力照査点の断面力と最大値抽出</h3>
  ${table(shearRows,
    ['部材', '点', ...r.cases.map((c) => `CASE-${c.id}`), '最大 Ｓ', 'CASE', 'τm', 'τa', '判定'], 'num')}
  <h3>6.2 せん断応力度の照査</h3>
  <p class="formula">τm ＝ Ｓ / (ｂ·ｊ·ｄ) ≦ τa ＝ ${n(r.allow.tauA1, 3)} Ｎ/mm²</p>
  <p class="note">照査位置はハンチ端とし、部材厚は基本厚を用いる(ハンチによる増加は見込まない)。</p>
  </section>`;

  // ---- 7 安定・基礎の検討 ----------------------------------------------
  const stability = `
  <section class="chapter">
  <h2>7 安定・基礎の検討</h2>
  ${table(r.stability.items.map((x) => [
    esc(x.label), esc(x.text), `CASE-${x.caseId}`,
    x.ok ? '<b class="ok">CHECK OK</b>' : '<b class="ng">CHECK NG</b>',
  ]), ['照査項目', '内容', '支配CASE', '判定'])}
  <p class="note">各荷重ケースについて照査し、最も厳しい結果を示す。</p>
  </section>`;

  const warn = r.warnings.length ? `
  <section class="chapter">
  <h2>8 確認事項</h2><ul>${r.warnings.map((w) => `<li>${esc(w)}</li>`).join('')}</ul>
  </section>` : '';

  return `<div class="print-header"><span>${esc(title)}</span><span>${esc(p.code || '')}</span></div>
  <article class="report" data-title="${esc(title)}" data-code="${esc(p.code || '')}">
    ${cover}${conditions}${forces}${summary}${rebar}${stress}${shear}${stability}${warn}
    <footer class="rp-foot">本計算書は設計の一次検討を目的としたものです。実施設計にあたっては有資格者による確認を行ってください。</footer>
  </article>`;
}

return { buildReport };
});

__require("ui/app").start();
})();
</script>
</body>
</html>
