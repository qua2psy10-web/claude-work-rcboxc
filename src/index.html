<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RCボックスカルバート 設計計算</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="app">
  <h1>RCボックスカルバート 設計計算</h1>
  <span class="sub">単室(1連) / 道路土工 カルバート工指針 / 許容応力度法</span>
  <div class="actions">
    <button id="btn-save" type="button">条件を保存</button>
    <button id="btn-load" type="button">条件を読込</button>
    <button id="btn-reset" type="button">既定値に戻す</button>
    <button id="btn-print" type="button">計算書を印刷</button>
    <input id="file" type="file" accept="application/json" hidden>
  </div>
</header>

<main>
  <section class="panel scroll" aria-label="設計条件の入力">
    <div id="form"></div>
  </section>
  <section class="panel" aria-label="図">
    <div id="figure"></div>
  </section>
  <section class="panel scroll" aria-label="計算結果">
    <div id="messages"></div>
    <div id="results"></div>
  </section>
</main>

<div id="report"></div>

<script type="module">
import { start } from './ui/app.js';
start();
</script>
</body>
</html>
